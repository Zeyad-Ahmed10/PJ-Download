<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مُنـزّل الفيديوهات المباشر</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #6366f1;
      --accent: #ec4899;
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.8);
      --text: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

    body {
      background: linear-gradient(135deg, #0f172a, #1e1b4b);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 15px;
    }

    .container { width: 100%; max-width: 700px; text-align: center; }

    h1 {
      font-size: 2.2rem;
      font-weight: 900;
      background: linear-gradient(to right, #818cf8, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 25px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }

    .input-group { display: flex; gap: 10px; margin-bottom: 15px; }

    input {
      flex: 1;
      padding: 14px 18px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      color: white;
      font-size: 1rem;
      outline: none;
    }

    button {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      border: none;
      padding: 14px 25px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      font-size: 1rem;
    }

    button:hover { opacity: 0.9; }

    .loader {
      display: none;
      margin: 20px 0;
      font-weight: 700;
      color: #818cf8;
    }

    .result {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 12px;
    }

    .dl-btn {
      display: inline-block;
      margin-top: 10px;
      background: #10b981;
      color: white;
      text-decoration: none;
      padding: 12px 25px;
      border-radius: 10px;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>مُنـزّل الفيديوهات المباشر</h1>

    <div class="card">
      <div class="input-group">
        <input type="url" id="videoUrl" placeholder="ضع رابط الفيديو من YouTube أو TikTok أو Facebook..." required>
        <button onclick="downloadVideo()">تحميل</button>
      </div>

      <div class="loader" id="loader"><i class="fas fa-spinner fa-spin"></i> جاري استخراج رابط التحميل...</div>

      <div class="result" id="resultContainer">
        <p id="resTitle">تم العثور على الفيديو بنجاح!</p>
        <a id="resDlLink" href="#" target="_blank" class="dl-btn"><i class="fas fa-download"></i> اضغط هنا لتحميل الفيديو</a>
      </div>
    </div>
  </div>

  <script>
    async function downloadVideo() {
      const url = document.getElementById('videoUrl').value.trim();
      const loader = document.getElementById('loader');
      const result = document.getElementById('resultContainer');

      if (!url) {
        alert('يرجى ادخال رابط صحيح');
        return;
      }

      loader.style.display = 'block';
      result.style.display = 'none';

      try {
        // استخدام خدمة معالجة خارجية بدون سيرفر بايثون
        const apiUrl = `https://api.cobalt.tools/api/json`;
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ url: url })
        });

        const data = await response.json();

        if (data.url) {
          document.getElementById('resDlLink').href = data.url;
          result.style.display = 'block';
        } else {
          alert('تعذر استخراج رابط الفيديو، تأكد من صحة الرابط.');
        }
      } catch (err) {
        alert('حدث خطأ أثناء جلب الفيديو، حاول مجدداً.');
      } finally {
        loader.style.display = 'none';
      }
    }
  </script>
</body>
</html>
